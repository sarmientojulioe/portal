# PLANTILLA: publicar una app en su propio subdominio.
# Copiar a /etc/nginx/sites-available/<app>, reemplazar los marcadores, enlazar
# y pedir el SSL. Sirve para Streamlit y para apps web comunes (los headers de
# WebSocket no molestan a las que no los usan).
#
# Marcadores:
#   SUBDOMINIO  -> p.ej. rrhh.americanad.ar
#   IP_APP      -> IP del servidor donde corre la app (p.ej. 172.16.18.101, vía túnel)
#   PUERTO      -> puerto en que escucha la app (p.ej. 8502)
#
# Pasos:
#   1) DNS en DonWeb:  A  SUBDOMINIO  ->  165.227.80.93   (el VPS de nginx)
#   2) sudo nano /etc/nginx/sites-available/<app>   (pegar este bloque, reemplazar)
#   3) sudo ln -s /etc/nginx/sites-available/<app> /etc/nginx/sites-enabled/
#   4) sudo nginx -t && sudo systemctl reload nginx
#   5) sudo certbot --nginx -d SUBDOMINIO            (agrega el 443 + redirección)

server {
    listen 80;
    server_name SUBDOMINIO;

    location / {
        proxy_pass http://IP_APP:PUERTO;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets (Streamlit). Inofensivo para apps que no los usan.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
