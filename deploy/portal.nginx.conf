# Portal de Aplicaciones — ÚNICA fuente de ruteo.
# Copiar a /etc/nginx/sites-available/portal y enlazar a sites-enabled.
# Requiere el map de websockets (deploy/nginx-websocket-map.conf -> conf.d/).
#
# Cada app Streamlit corre en su propio puerto local y se arranca con
# --server.baseUrlPath=<su_path>. El portal sirve el menú en la raíz.

# --- Reutilizable: cabeceras de proxy para apps Streamlit ---
# (nginx no soporta "include de directivas" por app sin duplicar; se repite
#  el bloque en cada location para mantenerlo explícito y legible.)

server {
    listen 80;
    server_name _;            # <-- poné tu dominio o la IP de la VM

    # gzip básico para el menú estático
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- Menú / portal (estático) ----
    location / {
        root /var/www/portal;
        try_files $uri $uri/ /index.html;
    }

    # ════════════════════════════════════════════════════════════════════
    #  APLICACIONES  (una location ^~ por app)
    # ════════════════════════════════════════════════════════════════════

    # ---- Cotizaciones (:8501) ----
    location ^~ /cotizaciones/ {
        proxy_pass http://127.0.0.1:8501/cotizaciones/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
    location = /cotizaciones { return 301 /cotizaciones/; }

    # ---- RRHH (:8502) ----
    location ^~ /rrhh/ {
        proxy_pass http://127.0.0.1:8502/rrhh/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
    location = /rrhh { return 301 /rrhh/; }

    # ---- Control de Flota (:8503) ----
    location ^~ /flota/ {
        proxy_pass http://127.0.0.1:8503/flota/;
