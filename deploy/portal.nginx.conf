# Portal de Aplicaciones — sitio ESTÁTICO en su propio subdominio.
# El portal NO proxea las apps: es un directorio que enlaza a cada
# <app>.americanad.ar. Cada app tiene su propio server block (ver
# deploy/template-subdominio.conf).
#
# Copiar a /etc/nginx/sites-available/portal y enlazar a sites-enabled.
# DNS: portal.americanad.ar  →  A  165.227.80.93   (el VPS de nginx)
# SSL: sudo certbot --nginx -d portal.americanad.ar

server {
    listen 80;
    server_name portal.americanad.ar;     # <-- ajustá si usás otro nombre

    root /var/www/portal;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
