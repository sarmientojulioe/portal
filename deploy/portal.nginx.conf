        proxy_read_timeout 86400;
    }
    location = /informes { return 301 /informes/; }

    # ---- Capacitaciones - CapacitaApp (:8507) ----
    location ^~ /capacitaciones/ {
        proxy_pass http://127.0.0.1:8507/capacitaciones/;
        proxy_http_version 1.1;
