    location = /certificaciones { return 301 /certificaciones/; }

    # ---- Inspecciones (:8505) ----
    location ^~ /inspecciones/ {
        proxy_pass http://127.0.0.1:8505/inspecciones/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
    location = /inspecciones { return 301 /inspecciones/; }

    # ---- Informes Médicos / Mercedario (:8506) ----
    location ^~ /informes/ {
        proxy_pass http://127.0.0.1:8506/informes/;
        proxy_http_version 1.1;
