    location = /flota { return 301 /flota/; }

    # ---- Certificaciones (:8504) ----
    location ^~ /certificaciones/ {
        proxy_pass http://127.0.0.1:8504/certificaciones/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
