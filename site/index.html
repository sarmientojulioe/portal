<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portal de Aplicaciones — American Advisor</title>
  <style>
    :root{
      --azul:#216AA0; --azul-2:#2884C7; --navy:#22355B;
      --bg:#EDEDED; --card:#FFFFFF; --muted:#6b7280;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; background:var(--bg); color:var(--navy);
      font-family:system-ui,"Segoe UI",Roboto,sans-serif;
      display:flex; flex-direction:column;
    }
    header{
      padding:44px 24px 6px; text-align:center;
    }
    header .logo{height:62px; width:auto; margin-bottom:18px}
    header h1{margin:0; font-size:26px; font-weight:700; letter-spacing:.4px}
    header .sub{margin-top:8px; color:var(--muted); font-size:15px}
    main{flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px}
    .grid{
      display:grid; gap:26px; width:100%; max-width:980px;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    }
    a.card{
      position:relative; display:block; padding:34px 26px; border-radius:18px;
      background:var(--card); text-decoration:none; color:var(--navy);
      box-shadow:0 8px 24px rgba(34,53,91,.10);
      transition:transform .12s ease, box-shadow .12s ease;
      border-top:5px solid var(--accent,var(--azul));
    }
    a.card:hover{transform:translateY(-5px); box-shadow:0 14px 32px rgba(34,53,91,.16)}
    a.card.disabled{opacity:.55; pointer-events:none; filter:grayscale(.3)}
    .ico{font-size:50px; line-height:1; display:block; margin-bottom:14px}
    .name{font-size:21px; font-weight:700}
    .name .ext{font-size:13px; color:var(--muted); font-weight:600}
    .desc{font-size:13.5px; color:var(--muted); margin-top:6px}
    .badge{
      position:absolute; top:16px; right:16px; font-size:10.5px; font-weight:700;
      letter-spacing:.5px; text-transform:uppercase; padding:4px 9px; border-radius:999px;
      background:#EAF2F8; color:var(--azul);
    }
    .badge.dev{background:#FFF4E5; color:#B26A00}
    .badge.off{background:#F1F1F1; color:#888}
    footer{padding:28px 18px 36px; text-align:center; color:var(--muted)}
    .isos{display:flex; gap:26px; align-items:center; justify-content:center;
          flex-wrap:wrap; margin-bottom:14px}
    .isos img{height:66px; width:auto; opacity:.92}
    footer .copy{font-size:12.5px}
  </style>
</head>
<body>
  <header>
    <img class="logo" src="assets/americanadvisor.png" alt="American Advisor">
    <h1>Portal de Aplicaciones</h1>
    <div class="sub">Entorno de desarrollo</div>
  </header>

  <main><div class="grid" id="grid"></div></main>

  <!-- Sumar una app: agregá una entrada al registro APPS (abajo) con su subdominio. -->
  <footer>
    <div class="isos">
      <img src="assets/iso9001.png"  alt="IRAM-ISO 9001 Gestión de la Calidad">
      <img src="assets/iso14001.jpg" alt="IRAM-ISO 14001 Gestión Ambiental">
      <img src="assets/iso45001.png" alt="IRAM-ISO 45001 Seguridad y Salud Ocupacional">
    </div>
    <div class="copy">© American Advisor · Sistemas de gestión certificados IRAM-ISO</div>
  </footer>

  <script>
    // ── Registro de aplicaciones ────────────────────────────────────────────
    // estado: "ok" (productiva) · "dev" (en desarrollo) · "off" (deshabilitada)
    // Directorio de subdominios. Cada app vive en su propio <app>.americanad.ar.
    // estado: "ok" = publicada (link activo) · "dev" = subdominio reservado, aún
    // no publicada · "off" = otro stack, próximamente. Solo "ok" es clicable.
    const APPS = [
      { key:"cotizaciones",   name:"Cotizaciones",    desc:"Solicitudes, catálogo y precios",
        icon:"💵", url:"https://cotizaciones.americanad.ar/",    accent:"#2884C7", estado:"ok" },
      { key:"rrhh",           name:"RRHH",            desc:"Indicadores y gestión de personal",
        icon:"🏢", url:"https://rrhh.americanad.ar/",            accent:"#216AA0", estado:"ok" },
      { key:"flota",          name:"Control de Flota",desc:"Disponibilidad y estado de vehículos",
        icon:"🚚", url:"https://flota.americanad.ar/",           accent:"#1E7F8C", estado:"ok" },
      { key:"inspecciones",   name:"Inspecciones",    desc:"Informes de inspección de equipos",
        icon:"🔧", url:"https://inspecciones.americanad.ar/",    accent:"#C2772B", estado:"ok" },

      // En desarrollo (subdominio reservado, todavía no publicado)
      { key:"certificaciones",name:"Certificaciones", desc:"Emisión y control de certificados",
        icon:"📜", url:"https://certificaciones.americanad.ar/", accent:"#5B7BD5", estado:"dev" },
      { key:"informes",       name:"Informes Médicos",desc:"Estudios del centro médico (Mercedario)",
        icon:"🩺", url:"https://informes.americanad.ar/",        accent:"#2E9E7A", estado:"dev" },
      { key:"capacitaciones", name:"Capacitaciones",  desc:"Cursos y certificación profesional",
        icon:"🎓", url:"https://capacitaciones.americanad.ar/",  accent:"#216AA0", estado:"dev" },

      // Próximamente (otros stacks: PHP / Flask / Django / .NET)
      { key:"asistente",      name:"Asistente IA",    desc:"Widget en emicar y americanad",
        icon:"🤖", url:"https://www.americanad.com.ar/",         accent:"#6b7280", estado:"off" },
      { key:"campus",         name:"Campus / Moodle", desc:"Plataforma de e-learning",
        icon:"🏫", url:"#", accent:"#6b7280", estado:"off" },
      { key:"salud",          name:"Salud (HIS)",     desc:"Sistema de información de salud",
        icon:"🏥", url:"#", accent:"#6b7280", estado:"off" },
      { key:"anmat",          name:"ANMAT / Trazamed",desc:"Trazabilidad de medicamentos",
        icon:"💊", url:"#", accent:"#6b7280", estado:"off" },
    ];

    const ETIQUETA = { ok: "Activa", dev: "En desarrollo", off: "Próximamente" };

    const grid = document.getElementById("grid");
    for (const app of APPS) {
      const live = app.estado === "ok";       // solo las publicadas son clicables
      const a = document.createElement(live ? "a" : "div");
      a.className = "card" + (live ? "" : " disabled");
      if (live) { a.href = app.url; a.target = "_blank"; a.rel = "noopener"; }
      a.style.setProperty("--accent", app.accent || "#216AA0");
      a.innerHTML = `
        <span class="badge ${app.estado}">${ETIQUETA[app.estado] || ""}</span>
        <span class="ico">${app.icon}</span>
        <div class="name">${app.name}${live ? ' <span class="ext">↗</span>' : ''}</div>
        <div class="desc">${app.desc}</div>`;
      grid.appendChild(a);
    }
  </script>
</body>
</html>
